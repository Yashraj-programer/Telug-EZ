                    <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 space-y-1">
                      <span className="text-[10px] font-black uppercase text-emerald-900">MUST-INCLUDE KEYWORDS</span>
                      <div className="flex flex-wrap gap-1.5 pt-1">
                        {decoderResult.keywordsExpected.map((k, i) => (
                          <span key={i} className="px-2.5 py-1 bg-white border border-emerald-300 rounded-lg text-xs font-bold text-emerald-900">
                            {k}
                          </span>
                        ))}
                      </div>
                    </div>

                    <div className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-2">
                      <span className="text-[10px] font-black uppercase text-stone-600">GUARANTEED SCORING SKELETON</span>
                      <div className="space-y-1 text-xs font-medium text-stone-700">
                        {decoderResult.answerBlueprint.map((b, i) => (
                          <div key={i}>{b}</div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 8. SPACED REVISION SCREEN */}
            {activeTab === 'revise' && (
              <div className="space-y-6 animate-fade-in">
                <div className="surface-card rounded-3xl p-5 flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-black uppercase text-teal-800">AUTOMATED QUEUE</span>
                    <h2 className="text-xl font-black text-stone-900 mt-0.5">Spaced Repetition Flashcards</h2>
                  </div>
                  <span className="text-xs font-bold text-stone-500">Today: 4 due</span>
                </div>

                <div
                  onClick={() => setReviewCardFlipped(!reviewCardFlipped)}
                  className="surface-elevated rounded-3xl p-8 text-center cursor-pointer min-h-[160px] flex flex-col items-center justify-center space-y-2 select-none border-teal-200 hover:border-teal-400 transition-all"
                >
                  <span className="text-[10px] font-black uppercase text-stone-400">TAP TO FLIP FLASHCARD</span>
                  <h3 className="text-xl font-black text-stone-900 font-telugu">
                    {reviewCardFlipped ? 'చద్దన్నము (రాత్రి తోడుపెట్టిన పెరుగు అన్నం)' : 'చల్ది అంటే ఏమిటి?'}
                  </h3>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => { setReviewCardFlipped(false); triggerToast('Saved for later review!'); }} className="p-4 rounded-2xl border border-rose-200 bg-rose-50 text-rose-900 text-xs font-black cursor-pointer">
                    Still Weak (Review Later)
                  </button>
                  <button onClick={() => { setReviewCardFlipped(false); addXP(15); }} className="p-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black cursor-pointer">
                    Mastered! (+15 XP)
                  </button>
                </div>
              </div>
            )}

            {/* 9. PROGRESS / READINESS SCREEN */}
            {activeTab === 'progress' && (
              <div className="space-y-6 animate-fade-in">
                <div className="surface-card rounded-3xl p-6 flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-black uppercase text-stone-400">EXAM READINESS</span>
                    <h2 className="text-2xl font-black text-stone-900">Overall Readiness: {overallReadiness}%</h2>
                    <p className="text-xs text-stone-500">Lesson 1: “చల్దులారగించుట” competency metrics.</p>
                  </div>
                </div>

                <div className="surface-card rounded-3xl p-6 space-y-3">
                  {[
                    { name: 'Understanding (భావ అవగాహన)', val: 85 },
                    { name: 'Padyams (పద్యాలు & భావాలు)', val: 75 },
                    { name: 'Answer Rebuild (సమాధాన రచన)', val: 80 },
                    { name: 'Kavi Parichayam (కవి పరిచయం)', val: 95 },
                    { name: 'Active Recall (స్మృతి బలం)', val: 70 },
                  ].map((item, idx) => (
                    <div key={idx} className="space-y-1">
                      <div className="flex justify-between text-xs font-bold text-stone-700">
                        <span>{item.name}</span>
                        <span className="font-mono-numbers">{item.val}%</span>
                      </div>
                      <div className="w-full h-2 rounded-full bg-stone-100 overflow-hidden">
                        <div className="h-full bg-amber-500 rounded-full" style={{ width: `${item.val}%` }}></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 10. LAST-MINUTE EMERGENCY MODE */}
            {activeTab === 'emergency' && (
              <div className="space-y-6 animate-fade-in">
                <div className="surface-elevated rounded-3xl p-6 bg-stone-900 text-white space-y-2">
                  <span className="text-[10px] font-black uppercase text-rose-300">DETERMINISTIC EXAM CRAM</span>
                  <h2 className="text-2xl font-black">LAST-MINUTE EMERGENCY MODE</h2>
                  <div className="flex gap-2 pt-2">
                    {['15m', '30m', '1h'].map((t) => (
                      <button
                        key={t}
                        onClick={() => setEmergencyTime(t)}
                        className={`px-3 py-1 rounded-xl text-xs font-black uppercase cursor-pointer ${emergencyTime === t ? 'bg-white text-stone-900' : 'bg-white/20 text-white'}`}
                      >
                        {t} Cram
                      </button>
                    ))}
                  </div>
                </div>

                <div className="surface-card rounded-3xl p-6 space-y-3 font-telugu">
                  <h3 className="text-base font-black text-stone-900">హై-ఈల్డ్ పాయింట్స్ ({emergencyTime}):</h3>
                  <div className="space-y-2 text-sm text-stone-800">
                    <div className="p-3 rounded-xl bg-amber-50 border border-amber-200">
                      <strong>1. కవి పరిచయం (4M):</strong> బమ్మెర పోతన, 15వ శతాబ్దం, వరంగల్ బమ్మెర, భాగవతం, సహజ పండితుడు.
                    </div>
                    <div className="p-3 rounded-xl bg-sky-50 border border-sky-200">
                      <strong>2. పద్య భావం (4M):</strong> కృష్ణుడు కర్ణిక వలె, గోపబాలురు తామర రేకుల వలె కూర్చున్నారు.
                    </div>
                    <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-200">
                      <strong>3. ముఖ్య అర్థాలు (2M):</strong> చల్ది = చద్దన్నము; కర్ణిక = తామరపువ్వు మధ్య భాగం.
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* AI Doubt Modal */}
          {aiModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-xs animate-fade-in">
              <div className="surface-elevated rounded-3xl p-6 max-w-lg w-full space-y-4">
                <div className="flex justify-between items-center border-b border-stone-100 pb-2">
                  <h3 className="text-sm font-black uppercase text-stone-900">TELUGU EZ CONTEXT TUTOR</h3>
                  <button onClick={() => { setAiModalOpen(false); setAiAnswer(null); }} className="text-stone-400 font-bold cursor-pointer hover:text-stone-600">✕</button>
                </div>

                <div className="flex flex-wrap gap-1.5">
                  {['Explain in simple Teenglish', 'Give me a real-life analogy', 'Why is this important for 4 marks?'].map((chip, i) => (
                    <button key={i} onClick={() => handleAskAI(chip)} className="px-2.5 py-1 rounded-lg bg-stone-100 text-stone-700 text-xs font-semibold cursor-pointer hover:bg-stone-200">
                      {chip}
                    </button>
                  ))}
                </div>

                <div className="flex gap-2">
                  <input
                    type="text"
                    value={aiQuestion}
                    onChange={(e) => setAiQuestion(e.target.value)}
                    placeholder="Ask doubt..."
                    className="flex-1 p-3 rounded-xl bg-stone-50 border border-stone-200 text-sm font-medium"
                  />
                  <button onClick={() => handleAskAI()} className="px-4 py-3 rounded-xl bg-stone-900 text-white font-black text-xs cursor-pointer hover:bg-stone-800">
                    Ask
                  </button>
                </div>

                {aiAnswer && (
                  <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs space-y-1.5 animate-fade-in">
                    <div className="font-bold text-amber-950 font-telugu">{aiAnswer.telugu}</div>
                    <div className="text-stone-700 font-medium">{aiAnswer.teenglish}</div>
                    <div className="font-black text-emerald-800 pt-1">🎯 {aiAnswer.takeaway}</div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Standalone Download Floating Button */}
          <div className="fixed bottom-4 right-4 z-40">
            <button
              onClick={downloadSingleFile}
              className="px-4 py-2.5 rounded-full bg-stone-900 hover:bg-stone-800 text-white text-xs font-black shadow-xl flex items-center gap-2 cursor-pointer transition-all active:scale-95 border border-stone-700"
            >
              <span>📥 Save as Single HTML</span>
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
